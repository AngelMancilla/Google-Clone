<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">

        <div class="icon">
            <img class="logo-img" src="google-logo-icon-png-svg.png" alt="Google logo">
        </div>

        <div class="search-box">
            <span class="material-symbols-outlined">search</span>

            <input class="search-input" type="text" placeholder="Search Google or type a URL" aria-label="Search">

            <span class="material-symbols-outlined">mic</span>
        </div>

        <div class="buttons">
            <button class="btn-search">Search with Google</button>
            <button class="btn-lucky">I'm Feeling Lucky</button>
        </div>

    </main>

    <script src="app.js"></script>
</body>

</html>
